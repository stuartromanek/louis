manifestVersion: 1
id: louis-louis
name: Louis
tagline: Yoto MYO playlists from YouTube
icon: https://raw.githubusercontent.com/stuartromanek/louis/main/homeassistant/louis/icon.png
category: media
version: "1.1.2"
port: 4000
description: >-
  Louis is a Make Your Own (MYO) client for Yoto: search YouTube, arrange playlists, and save them to your Yoto account.

  Set LOUIS_YOTO_CLIENT_ID in the app environment (Umbrel app settings) before connecting. Register your redirect URI on yoto.dev — typically `http://<umbrel-host>:4000/api/yoto/auth/callback` or your Umbrel `.local` URL.

  YouTube API key is optional; bundled yt-dlp handles search without one. Single instance only — do not scale replicas.
developer: Louis contributors
website: https://github.com/stuartromanek/louis
submitter: stuartromanek
submission: https://github.com/stuartromanek/louis/tree/main/deploy/umbrel
repo: https://github.com/stuartromanek/louis
support: https://github.com/stuartromanek/louis/issues
gallery:
  - https://raw.githubusercontent.com/stuartromanek/louis/main/docs/images/louis-readme-banner.webp
dependencies: []
path: ""
