name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-docker:
    name: GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            YTDLP_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-mac:
    name: Desktop macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync desktop package version
        run: npm run desktop:sync-version

      - name: Fetch macOS yt-dlp + ffmpeg
        run: npm run desktop:fetch-binaries -- darwin-arm64 darwin-x64

      - name: Build Nuxt
        run: npm run build

      - name: Build DMGs (unsigned; see docs/DESKTOP_SIGNING.md for CI signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Verify macOS DMGs (arm64 + x64)
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64=(desktop/out/Louis-*-arm64.dmg)
          x64=(desktop/out/Louis-*-x64.dmg)
          ls -la desktop/out/Louis-*.dmg || true
          (( ${#arm64[@]} == 1 )) || { echo "expected one arm64 DMG, got ${#arm64[@]}"; exit 1; }
          (( ${#x64[@]} == 1 )) || { echo "expected one x64 DMG, got ${#x64[@]}"; exit 1; }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            desktop/out/Louis-*-arm64.dmg
            desktop/out/Louis-*-x64.dmg
          if-no-files-found: error

  desktop-win:
    name: Desktop Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync desktop package version
        run: npm run desktop:sync-version

      - name: Fetch Windows yt-dlp + ffmpeg
        run: npm run desktop:fetch-binaries -- win32-x64

      - name: Build Nuxt
        run: npm run build

      - name: Build NSIS (unsigned; see docs/DESKTOP_SIGNING.md for CI signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: |
            desktop/out/Louis-Setup-*.exe
          if-no-files-found: error

  upload-desktop-assets:
    name: Attach installers to GitHub Release
    needs: [desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-win
          path: dist

      - name: Wait for GitHub Release (release-it creates it after tag push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          for i in $(seq 1 36); do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $tag is ready"
              exit 0
            fi
            echo "Waiting for release $tag ($i/36)…"
            sleep 10
          done
          echo "Release not found after wait; softprops will create one if needed"

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Louis-*.dmg
            dist/Louis-Setup-*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
