<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting Louis…</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f0;
      --ink: #1a1a1a;
      --accent: #2f6fed;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      opacity: 0.75;
      font-size: 0.95rem;
    }
    .bar {
      width: 10rem;
      height: 0.35rem;
      margin-top: 0.75rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ink) 12%, transparent);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Louis</h1>
    <p>Starting local server…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
